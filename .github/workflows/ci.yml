name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  # The core suite on every supported Python, with nothing but NumPy and PyYAML.
  # Tests that need a toolchain or an optional package are skipped here and run in `full`.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Each Python reports its own result: one failing does not cancel the others.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No CUDA needed: tests run the .ptx files checked in under examples/.
      - run: pip install -e ".[dev]"
      - name: Run the suite with nothing but NumPy and PyYAML
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Report the pytest failure
        if: failure()
        shell: bash {0}
        run: .github/report_pytest_failure.sh

  # What a user installs, instead of the checkout the other jobs run: the sdist and the wheel
  # are built as for a release (RELEASING.md), one of them is installed into a clean
  # environment, and the core suite runs against it. `pip install -e` cannot show a data file
  # that the wheel lacks or a path that reaches out of the package into the repository.
  dist:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Installing the sdist has pip build a wheel of its own from it.
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist, and the wheel from it
        run: |
          python -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/pip" install build twine
          "$RUNNER_TEMP/build-env/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/build-env/bin/twine" check --strict "$RUNNER_TEMP"/dist/*
          ls -l "$RUNNER_TEMP/dist"
      # pytest alone, not the dev extra: without `build`, tests/test_packaging.py checks the
      # installed files and leaves building to the `test` and `full` jobs.
      - name: Install the ${{ matrix.artifact }} into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          case "${{ matrix.artifact }}" in
            wheel) file="$(ls "$RUNNER_TEMP"/dist/*.whl)" ;;
            sdist) file="$(ls "$RUNNER_TEMP"/dist/*.tar.gz)" ;;
          esac
          "$RUNNER_TEMP/venv/bin/pip" install "$file" pytest
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The tests name files of the package as <checkout>/warplens/...: give them the installed
      # ones, so that nothing below can read the package from the checkout.
      - name: Put the installed package in place of the checkout's
        run: |
          rm -rf warplens
          installed="$(cd "$RUNNER_TEMP" && python -c 'import pathlib, warplens; print(pathlib.Path(warplens.__file__).parent)')"
          case "$installed" in
            "$RUNNER_TEMP"/venv/lib/*/site-packages/warplens) ln -s "$installed" warplens ;;
            *) echo "::error title=dist::warplens was imported from $installed, not from the environment"; exit 1 ;;
          esac
      - name: Smoke test, outside the checkout (the command, the version, three examples)
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          warplens --help
          warplens run --help
          python - <<'EOF'
          import importlib.metadata, warplens
          print("warplens", warplens.__version__, "from", warplens.__file__)
          assert importlib.metadata.version("warplens") == warplens.__version__
          EOF
          python "$GITHUB_WORKSPACE/examples/00_vecadd/run.py" | tee vecadd.out
          grep -q "matches NumPy: True" vecadd.out
          python "$GITHUB_WORKSPACE/examples/02_tma_copy/run.py" | tee tma_copy.out
          grep -q "output correct" tma_copy.out
          python "$GITHUB_WORKSPACE/examples/04_pipelined_gemm/run.py"
      - name: Run the suite against the installed package
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest.log
      - name: Report the pytest failure
        if: failure()
        shell: bash {0}
        run: .github/report_pytest_failure.sh

  triton:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,triton]"
      # Exercise the optional frontend, including install/cleanup, without a GPU.
      - run: pytest -q tests/test_triton*.py

  # Everything, with no test allowed to skip: the conda env from env/ supplies nvcc and the
  # CUDA headers (compile-only, no GPU), so the CUTLASS tutorials are fetched and built, the
  # shim libraries are compiled, and Triton, the CuTe DSL and TIRx are installed.
  # env/environment.yml pins the toolkit to the exact nvcc the committed predictions were made
  # with, and env/check.sh fails on any other: a toolkit change is a commit that regenerates
  # them (env/README.md, "Changing the toolkit"), never something conda-forge does to this job.
  full:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      WARPLENS_NO_SKIPS: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: env/environment.yml
          cache-environment: true
      - run: env/check.sh
      - run: pip install -e ".[all]"
      # The tracer of matrix rows RT-10 and RT-11 runs under gdb, and one test runs it for real
      # on a program without CUDA. The runner image has no gdb, and here that skip is a failure.
      # Any gdb with Python support does (env/remote/setup.sh installs it the same way).
      - name: Install gdb, for the driver call tracer
        run: |
          command -v gdb || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
          gdb -q -batch -ex "python print('gdb-python-ok')" | grep -q gdb-python-ok
      - name: Build the CUTLASS tutorials (PTX and host programs)
        run: examples/03_cutlass_mma/build.sh --programs
      - name: Build the shim libraries
        run: warplens/shim/build.sh
      # The book's kernels are run from its own repository, which has no license to copy from.
      # The commit is the one tests/test_book.py was written against.
      - name: Fetch the MLSys book
        run: |
          git init -q "$RUNNER_TEMP/book"
          git -C "$RUNNER_TEMP/book" fetch -q --depth 1 https://github.com/mlc-ai/modern-gpu-programming-for-mlsys 3a24144defa6da03d4ab8a1dfcf513b18007d15f
          git -C "$RUNNER_TEMP/book" checkout -q FETCH_HEAD
          echo "WARPLENS_BOOK=$RUNNER_TEMP/book" >> "$GITHUB_ENV"
      - name: Run the whole suite; no test may skip
        run: |
          set -o pipefail
          pytest -q -rfEs 2>&1 | tee pytest.log
      # Put the failure summary where it can be read without downloading the log, as a few
      # short annotations. A separate step, so it runs however pytest ended.
      - name: Report the pytest failure
        if: failure()
        shell: bash {0}
        run: .github/report_pytest_failure.sh
