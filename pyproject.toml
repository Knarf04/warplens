[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warplens"
version = "0.0.1"
description = "Understand a Blackwell GPU by watching it run, on your CPU."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["warplens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
