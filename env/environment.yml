# warplens development environment.
# Create or update with: env/setup.sh
#
# The CUDA packages here are only the *compiler* side (nvcc, headers). They are
# used to turn CUDA C++ into PTX for sm_100a / sm_103a. No GPU or driver is
# needed, and the system CUDA install in /usr/local/cuda is left untouched.
name: warplens
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pyyaml
  - pytest
  # Compile-only. cuda-version selects the release, not its compiler patch.
  # Keep these exact builds aligned with remote/pins.env and both prediction
  # provenance files; a new patch can emit different PTX.
  - cuda-version=13.5
  - cuda-nvcc=13.5.37
  - cuda-cudart-dev=13.5.37
  # NVRTC that knows sm_100a: TIRx compiles its kernels with it, in process.
  - cuda-nvrtc=13.5.37
