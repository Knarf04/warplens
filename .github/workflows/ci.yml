name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  # The core suite on every supported Python, with nothing but NumPy and PyYAML.
  # Tests that need a toolchain or an optional package are skipped here and run in `full`.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Each Python reports its own result: one failing does not cancel the others.
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No CUDA needed: tests run the .ptx files checked in under examples/.
      - run: pip install -e ".[dev]"
      - name: Run the suite with nothing but NumPy and PyYAML
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Report the pytest failure
        if: failure()
        shell: bash {0}
        run: .github/report_pytest_failure.sh

  triton:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,triton]"
      # Exercise the optional frontend, including install/cleanup, without a GPU.
      - run: pytest -q tests/test_triton*.py

  # Everything, with no test allowed to skip: the conda env from env/ supplies nvcc and the
  # CUDA headers (compile-only, no GPU), so the CUTLASS tutorials are fetched and built, the
  # shim libraries are compiled, and Triton, the CuTe DSL and TIRx are installed.
  # env/environment.yml pins the toolkit to the exact nvcc the committed predictions were made
  # with, and env/check.sh fails on any other: a toolkit change is a commit that regenerates
  # them (env/README.md, "Changing the toolkit"), never something conda-forge does to this job.
  full:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      WARPLENS_NO_SKIPS: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: env/environment.yml
          cache-environment: true
      - run: env/check.sh
      - run: pip install -e ".[all]"
      - name: Build the CUTLASS tutorials (PTX and host programs)
        run: examples/03_cutlass_mma/build.sh --programs
      - name: Build the shim libraries
        run: warplens/shim/build.sh
      # The book's kernels are run from its own repository, which has no license to copy from.
      # The commit is the one tests/test_book.py was written against.
      - name: Fetch the MLSys book
        run: |
          git init -q "$RUNNER_TEMP/book"
          git -C "$RUNNER_TEMP/book" fetch -q --depth 1 https://github.com/mlc-ai/modern-gpu-programming-for-mlsys 3a24144defa6da03d4ab8a1dfcf513b18007d15f
          git -C "$RUNNER_TEMP/book" checkout -q FETCH_HEAD
          echo "WARPLENS_BOOK=$RUNNER_TEMP/book" >> "$GITHUB_ENV"
      - name: Run the whole suite; no test may skip
        run: |
          set -o pipefail
          pytest -q -rfEs 2>&1 | tee pytest.log
      # Put the failure summary where it can be read without downloading the log, as a few
      # short annotations. A separate step, so it runs however pytest ended.
      - name: Report the pytest failure
        if: failure()
        shell: bash {0}
        run: .github/report_pytest_failure.sh
