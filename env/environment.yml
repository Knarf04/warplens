# warplens development environment.
# Create or update with: env/setup.sh
#
# The CUDA packages here are only the *compiler* side (nvcc, headers). They are
# used to turn CUDA C++ into PTX for sm_100a / sm_103a. No GPU or driver is
# needed, and the system CUDA install in /usr/local/cuda is left untouched.
name: warplens
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pyyaml
  - pytest
  # CUDA toolchain (compile-only). cuda-version pins the release of every cuda-* package;
  # the three below are pinned to the exact build, because the committed predictions
  # (validation/blackwell/predicted/provenance.json, validation/blackwell_timing/predicted/
  # meta.json) are the simulator's run of this nvcc's PTX and check.sh refuses any other.
  # The same versions are in env/remote/pins.env; tests/test_rental_harness.py holds the
  # four files together. To move to another build see README.md, "Changing the toolkit".
  - cuda-version=13.5
  - cuda-nvcc=13.5.37
  - cuda-cudart-dev=13.5.37
  # NVRTC that knows sm_100a: TIRx compiles its kernels with it, in process.
  - cuda-nvrtc=13.5.37
